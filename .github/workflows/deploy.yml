name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Render backend — triggers a new deploy on every push to main.
  # Netlify frontend auto-deploys via its own GitHub integration (no action needed).
  deploy-backend:
    name: Render backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
