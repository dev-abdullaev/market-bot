[build]
  command = "npm run build"
  publish = "dist"

# ---------------------------------------------------------------------------
# IMPORTANT: Replace the placeholder below with your actual Render backend URL
# once deployed.  Example: https://market-bot-backend.onrender.com/api/:splat
# ---------------------------------------------------------------------------
[[redirects]]
  from   = "/api/*"
  to     = "https://REPLACE-WITH-RENDER-BACKEND.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — must come AFTER the /api proxy rule above
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
